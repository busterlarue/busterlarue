[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "talk-analyzer"
version = "0.1.0"
description = "Analyze talk transcripts and generate after-action reviews"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Buster Larue"}
]
keywords = ["talk", "transcript", "analysis", "speaking", "presentation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = []

[project.optional-dependencies]
email = ["sendgrid>=6.9", "markdown>=3.4"]
notion = ["notion-client>=2.0"]
all = ["sendgrid>=6.9", "markdown>=3.4", "notion-client>=2.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
talk-analyzer = "talk_analyzer.cli:main"

[project.urls]
Homepage = "https://github.com/busterlarue/talk-analyzer"

[tool.setuptools.packages.find]
include = ["talk_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
